# Profilo dev: bind mount del sorgente per l'hot reload, porte pubblicate su
# localhost, node_modules sempre in volume nominato (mai dall'host, altrimenti
# si trascinano binari nativi incompatibili con il container). Ogni bind mount
# ha il suffisso :z: su Fedora con SELinux, senza, il container vede la
# cartella vuota.

services:
  web:
    # nome immagine distinto da quello di compose.yaml/local-prod: stesso
    # servizio, stage diverso (deps con toolchain di sviluppo vs runner).
    # Senza questo, un `pnpm dev` lanciato dopo un `pnpm local-prod` riusa
    # per sbaglio l'immagine runner già buildata invece di ricostruire per
    # "deps" (dev non passa --build di suo), e il container parte senza
    # pnpm/corepack o con l'utente "node" non root che non può scrivere sui
    # volumi nominati appena creati.
    image: gestilab-web-dev
    build:
      target: deps
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile --filter @gestilab/web... --store-dir /pnpm-store && pnpm --filter @gestilab/web exec next dev --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
      # pnpm chiede conferma interattiva prima di modificare node_modules
      # quando il lockfile cambia (nuove dipendenze in un pacchetto del
      # workspace); nel container non c'è una TTY per rispondere. CI=true è
      # il modo che pnpm stesso documenta per un install non presidiato.
      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app:z
      - pnpm_store:/pnpm-store
      - nm_web_root:/app/node_modules
      - nm_web_web:/app/apps/web/node_modules
      - nm_web_api:/app/apps/api/node_modules
      - nm_web_shared:/app/packages/shared/node_modules
      - nm_web_db:/app/packages/db/node_modules
    healthcheck:
      start_period: 90s

  api:
    # vedi commento sopra su "web": stesso motivo.
    image: gestilab-api-dev
    build:
      target: deps
    command:
      - sh
      - -c
      # anche @gestilab/db, non solo @gestilab/api: "pnpm db:migrate" (radice)
      # esegue le migrazioni in questo stesso container (docs/CLAUDE.md).
      - pnpm install --frozen-lockfile --filter @gestilab/api... --filter @gestilab/db... --store-dir /pnpm-store && pnpm --filter @gestilab/api run dev
    environment:
      NODE_ENV: development
      CI: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/app:z
      - pnpm_store:/pnpm-store
      - nm_api_root:/app/node_modules
      - nm_api_web:/app/apps/web/node_modules
      - nm_api_api:/app/apps/api/node_modules
      - nm_api_shared:/app/packages/shared/node_modules
      - nm_api_db:/app/packages/db/node_modules
    healthcheck:
      start_period: 90s

  db:
    # 5433 sull'host: la 5432 di default risultava già occupata da un
    # PostgreSQL nativo su questa macchina. Internamente il container resta
    # in ascolto su 5432 (DATABASE_URL usa l'hostname "db", non l'host).
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"

  storage:
    ports:
      - "9000:9000"
      - "9001:9001"

  mailpit:
    ports:
      - "8025:8025"
      - "1025:1025"

  glitchtip:
    ports:
      - "8000:8000"

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pnpm_store:
  nm_web_root:
  nm_web_web:
  nm_web_api:
  nm_web_shared:
  nm_web_db:
  nm_api_root:
  nm_api_web:
  nm_api_api:
  nm_api_shared:
  nm_api_db:
