packages:
  - "apps/*"
  - "packages/*"
  # gestilab-auth-service (repository separato, privato — submodule
  # pinnato a un tag): solo il pacchetto in sé, non un glob su vendor/*,
  # per non includere anche il SUO submodule interno
  # (vendor/gestilab-auth-service/vendor/gestilab-app), che avrebbe pacchetti
  # con lo stesso nome (@gestilab/db, @gestilab/shared) di quelli reali qui
  # sopra — un conflitto di nomi nello stesso workspace pnpm.
  - "vendor/gestilab-auth-service"
allowBuilds:
  argon2: true
  esbuild: true
  unrs-resolver: true
# postcss@8.4.31 (vulnerabilità alta, GHSA-6g55-p6wh-862q e GHSA-r28c-9q8g-f849)
# è una dipendenza interna di next@15.5.25, non nostra: senza questo override
# resta usata così com'è finché Next non aggiorna la propria dipendenza.
overrides:
  postcss: ^8.5.28
