# Definizione condivisa dei servizi. Nessuna porta pubblicata qui: le
# esposizioni verso l'host stanno solo in compose.dev.yaml (e in futuro nei
# profili local-prod/prod, dietro il proxy). Un solo stack, tre profili
# (vedi docs/02-architettura.md): qui c'è solo la base comune.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      # Docker imposta di suo HOSTNAME=<id container>; il server standalone
      # di Next.js legge proprio HOSTNAME come indirizzo su cui ascoltare
      # (fallback a 0.0.0.0 solo se non impostata), quindi va sovrascritta
      # esplicitamente o il server si mette in ascolto su un hostname che
      # nessuno può raggiungere.
      HOSTNAME: 0.0.0.0
    healthcheck:
      # 127.0.0.1 esplicito: Node in ascolto su 0.0.0.0 non risponde su ::1,
      # e "localhost" nel container risolve prima su IPv6.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
    healthcheck:
      # 127.0.0.1 esplicito: stesso motivo del servizio web.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/v1/salute"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  storage:
    image: quay.io/minio/minio:latest
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  glitchtip:
    image: glitchtip/glitchtip:latest
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL}
      REDIS_URL: ${GLITCHTIP_REDIS_URL}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
      PORT: 8000
      # SERVER_ROLE=all_in_one fa eseguire a ./bin/start.sh (comando di
      # default dell'immagine) migrazioni + web + worker in un solo processo:
      # un unico servizio "glitchtip", come richiesto, senza reinventare lo
      # script di avvio (che gestisce anche i permessi corretti sui file
      # statici, a differenza di un collectstatic manuale).
      SERVER_ROLE: all_in_one
    volumes:
      - glitchtipdata:/code/uploads
    healthcheck:
      # niente curl/wget in questa immagine: usa il python già presente.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_health/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  glitchtipdata:
