name: CI

# dev è il branch di integrazione reale (docs/04-convenzioni-codice.md §
# CI): main resta congelato allo scheletro del task 0.1 per regola
# permanente, non riceve mai altri push, quindi non ha senso triggerare la
# pipeline su di lui.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  BASE_DOMAIN: localhost
  API_PORT: 3001
  API_HOST: 0.0.0.0
  POSTGRES_USER: gestilab
  POSTGRES_PASSWORD: gestilab_ci_password
  POSTGRES_DB: gestilab
  DATABASE_URL: postgres://gestilab_app:gestilab_app_ci_password@localhost:5432/gestilab
  DATABASE_MIGRATE_URL: postgres://gestilab:gestilab_ci_password@localhost:5432/gestilab
  REDIS_URL: redis://localhost:6379
  S3_ENDPOINT: http://localhost:9000
  S3_BUCKET: gestilab-ci
  SMTP_URL: smtp://localhost:1025
  LOG_LEVEL: error

jobs:
  verifica:
    name: lint, typecheck, test, audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestilab
          POSTGRES_PASSWORD: gestilab_ci_password
          POSTGRES_DB: gestilab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gestilab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Checkout di gestilab-app col token di default (HTTPS): "ssh-key" su
      # questo step userebbe SSH anche per QUESTO repository, e la deploy
      # key sotto ha accesso solo a gestilab-auth-service — checkout
      # fallirebbe a clonare gestilab-app stesso.
      - uses: actions/checkout@v4

      # gestilab-auth-service (vendor/gestilab-auth-service) è un submodule
      # di un repository privato: il GITHUB_TOKEN di default non vi ha
      # accesso. webfactory/ssh-agent carica la deploy key sola lettura
      # (secret AUTH_SERVICE_DEPLOY_KEY) in un agent SSH, usato solo dal
      # comando "git submodule" successivo — il checkout sopra non lo vede.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTH_SERVICE_DEPLOY_KEY }}

      - run: git submodule update --init vendor/gestilab-auth-service

      - uses: pnpm/action-setup@v4
        with:
          version: "11.4.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pg_dump/pg_restore/psql: usati da packages/db/src/backup.test.ts
      # (task 0.10), che gira qui direttamente sul runner, non dentro
      # un'immagine Docker (quella ha già i client via apps/api/Dockerfile).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - run: pnpm lint

      - run: pnpm typecheck

      # Ruoli, schema e RLS (packages/db/migrations), poi i due tenant demo:
      # plugin/tenant.test.ts (apps/api) cerca lo slug "dellaquila" seminato
      # qui, non un fixture a parte.
      - run: pnpm --filter @gestilab/db run migrate
      - run: pnpm --filter @gestilab/db run seed

      # gestilab-auth-service è ora un membro del workspace (vendor/): le sue
      # suite (src/moduli/accesso/*.test.ts, src/app.test.ts) leggono/scrivono
      # sulla tabella "sessioni", che le sue migrazioni creano — mai quelle
      # di @gestilab/db. Stessa DATABASE_MIGRATE_URL (stesso database, ruolo
      # owner): la migrazione 0000 di questo servizio richiede che il ruolo
      # "app_user" esista già, quindi va dopo "pnpm --filter @gestilab/db run
      # migrate", non prima.
      #
      # DATABASE_URL qui è quella di gestilab_auth, non quella globale
      # (gestilab_app, usata da @gestilab/api e @gestilab/web): src/db/
      # migrate.ts di questo servizio allinea la password del ruolo
      # gestilab_auth a quella letta da DATABASE_URL — con quella globale
      # imposterebbe la password del ruolo sbagliato, e le sue suite (che
      # si connettono come gestilab_auth) fallirebbero il login. Mai lo
      # stesso ruolo per due servizi diversi, anche sullo stesso database
      # (vedi il documento di riferimento, sezione sul servizio auth).
      - run: pnpm --filter gestilab-auth-service run migrate
        env:
          DATABASE_URL: postgres://gestilab_auth:gestilab_auth_ci_password@localhost:5432/gestilab

      # Esclude gestilab-auth-service: le sue suite girano nello step
      # successivo, con la DATABASE_URL corretta per il suo ruolo.
      - run: pnpm exec turbo run test --filter='!gestilab-auth-service'

      - run: pnpm --filter gestilab-auth-service test
        env:
          DATABASE_URL: postgres://gestilab_auth:gestilab_auth_ci_password@localhost:5432/gestilab

      # docs/06-sicurezza-gdpr.md § 2.9: una vulnerabilità "alta" blocca il
      # merge. "moderate" e sotto non bloccano la pipeline.
      - run: pnpm audit --audit-level=high

  build-immagini:
    name: build immagini Docker
    needs: verifica
    runs-on: ubuntu-latest
    steps:
      # Stessa deploy key del job "verifica" (vedi i commenti lì): checkout
      # di gestilab-app col token di default, submodule via ssh-agent
      # dedicato — entrambi i Dockerfile fanno "COPY . ." sull'intero
      # workspace, incluso vendor/gestilab-auth-service.
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTH_SERVICE_DEPLOY_KEY }}

      - run: git submodule update --init vendor/gestilab-auth-service

      - uses: docker/setup-buildx-action@v3

      # Solo build, nessun push: non esiste ancora un ambiente remoto che
      # consumerebbe queste immagini (docs/04-convenzioni-codice.md § CI).
      - run: docker build -f apps/web/Dockerfile -t gestilab-web:ci .
      - run: docker build -f apps/api/Dockerfile -t gestilab-api:ci .
