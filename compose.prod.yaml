# Profilo prod. Scritto e versionato, MAI ESEGUITO finché non ci sarà un
# dominio registrato e un VPS (vedi "Prerequisiti a spesa" in
# docs/07-backlog-mvp.md — fuori da questa fase). Nessuna differenza
# strutturale rispetto a compose.local-prod.yaml: stessi servizi, stesso
# routing. Cambiano solo BASE_DOMAIN, l'emittente del certificato (Let's
# Encrypt DNS-01 invece di mkcert) e l'irrobustimento operativo richiesto da
# docs/02-architettura.md per un ambiente reale (restart policy, limiti di
# risorse). Quando arriverà il momento:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Nessuna modifica al codice: solo BASE_DOMAIN, il token del provider DNS e
# i DSN dei servizi esterni in .env.

x-restart-policy: &restart-policy unless-stopped

services:
  proxy:
    image: traefik:v3
    restart: *restart-policy
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    command:
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${DNS_PROVIDER}
    volumes:
      - ./docker/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro,z
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy

  web:
    image: gestilab-web-prod
    restart: *restart-policy
    mem_limit: 512m
    cpus: 1.0
    environment:
      BASE_DOMAIN: gestilab.it
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`dellaquila.gestilab.it`) || Host(`demo.gestilab.it`) || Host(`app.gestilab.it`) || Host(`console.gestilab.it`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=3000

  api:
    image: gestilab-api-prod
    restart: *restart-policy
    mem_limit: 512m
    cpus: 1.0
    environment:
      BASE_DOMAIN: gestilab.it

  db:
    restart: *restart-policy
    mem_limit: 1024m
    cpus: 1.0

  redis:
    restart: *restart-policy
    mem_limit: 256m
    cpus: 0.5

  storage:
    restart: *restart-policy
    mem_limit: 512m
    cpus: 1.0

  mailpit:
    restart: *restart-policy
    mem_limit: 128m
    cpus: 0.25

  glitchtip:
    restart: *restart-policy
    mem_limit: 1024m
    cpus: 1.0

volumes:
  letsencrypt:
